name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paint-anything-fabric-26.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build --stacktrace

      - name: Guardar el mod compilado
        uses: actions/upload-artifact@v4
        with:
          name: paint_anything-fabric-26.3
          path: |
            paint-anything-fabric-26.3/build/libs/*.jar
            !paint-anything-fabric-26.3/build/libs/*-sources.jar
