name: Compilar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copycats_lite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build

      - name: Subir el mod
        uses: actions/upload-artifact@v4
        with:
          name: copycats-lite
          path: |
            copycats_lite/build/libs/*.jar
            !copycats_lite/build/libs/*-sources.jar
